  <path d="M330 230 c-6-7-16-3-16 5 0 7 16 16 16 16 0 0 16-9 16-16 0-8-10-12-16-5Z" fill="#ff9eb5" opacity=".85"/>
  <circle cx="300" cy="290" r="6" fill="#9ad7ff" opacity=".8"/>
  <circle cx="150" cy="318" r="5" fill="#ffe066"/>
