  <circle cx="206" cy="180" r="4.5" fill="#5b4a45"/><circle cx="234" cy="180" r="4.5" fill="#5b4a45"/>
  <path d="M210 196 Q220 206 230 196" stroke="#5b4a45" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <circle cx="198" cy="192" r="6" fill="#ffb3c2" opacity=".7"/><circle cx="242" cy="192" r="6" fill="#ffb3c2" opacity=".7"/>
  <path d="M200 150 Q220 138 240 150" stroke="#fff3e9" stroke-width="9" fill="none" stroke-linecap="round"/>
  <!-- 달력 태그 "10개월" -->
