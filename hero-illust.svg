    <rect x="48" y="222" width="92" height="74" rx="12" fill="#ffffff" stroke="#7bae8e" stroke-width="3"/>
    <rect x="48" y="222" width="92" height="22" rx="11" fill="#7bae8e"/>
    <circle cx="68" cy="218" r="4" fill="#7bae8e"/><circle cx="120" cy="218" r="4" fill="#7bae8e"/>
    <text x="94" y="276" font-size="30" font-weight="800" text-anchor="middle" fill="#3b3a3c" font-family="Pretendard,sans-serif">10</text>
    <text x="94" y="290" font-size="12" font-weight="700" text-anchor="middle" fill="#6c6a6e" font-family="Pretendard,sans-serif">개월</text>
