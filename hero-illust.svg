    <linearGradient id="heart" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9eb5"/><stop offset="1" stop-color="#d96e85"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="424" height="344" rx="34" fill="url(#sky)"/>
  <!-- 구름 -->
  <g fill="#ffffff" opacity=".85">
